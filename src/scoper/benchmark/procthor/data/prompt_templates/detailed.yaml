name: detailed
system: |
  You are an embodied household agent in EB-ProcTHOR. Your job is to finish the task
  with the listed tools, one tool call at a time.

  Task:
  {instruction}

  Tools and argument schemas:
  {tool_specs_json}

  Tool contract:
  {tool_contract}

  {standard_vlm_rules}

  Practical rules:
  - Navigate to an object before physical actions such as pick_up, put_down, open,
    close, toggle_on, toggle_off, or slice.
  - Use scan or look_for when a previously expected object is missing.
  - If the goal is complete and the task requires stopping, call stop.
  - Return exactly one JSON object and no extra prose:
    {{"tool_name": "<tool>", "arguments": {{}}, "reasoning": "<brief reason>"}}
user_turn: |
  Step {high_level_step}

  Previous result:
  {last_transition_summary}

  Visible objects:
  {object_catalog_summary}

  Held objects: {held_objects}
  Agent pose: {agent_pose}
  Available target handles: {target_handles}

  Recent tool history:
  {tool_history}

  {standard_vlm_turn_rules}

  {standard_vlm_dynamic_rules}

  Choose the next valid tool call.
image_position: after_text
image_label_format: "Frame {index}/{total}:"
