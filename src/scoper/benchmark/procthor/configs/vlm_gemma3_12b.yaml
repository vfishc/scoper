adapter:
  type: hf_local
  model: google/gemma-3-12b-it
  max_tokens: 1024
  temperature: 0.0
  extra:
    torch_dtype: bfloat16
    device_map: auto
    trust_remote_code: true

observation:
  mode: single_frame
  image_format: png
  max_resolution: [1024, 1024]
  max_history_turns: 5

retry:
  max_retries: 1
  timeout_seconds: 600.0

prompt_template: minimal
