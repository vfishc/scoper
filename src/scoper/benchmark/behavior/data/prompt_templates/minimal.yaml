name: minimal
system: |
  You are an embodied household agent in EB-BEHAVIOR. Complete the task using one
  valid tool call at a time.

  Task:
  {instruction}

  Available tools:
  {tool_specs_json}

  Tool contract:
  {tool_contract}

  {standard_vlm_rules}

  Rules:
  - Use role handles from Available target handles when a tool expects a target.
  - Use room ids from Available room handles when navigating to a room.
  - If a human question appears, answer with answer(question_id, value).
  - If the last result failed, adjust from the feedback and history.
  - If the task is complete and stopping is required, call stop.

  Always respond with exactly one JSON object:
  {{"tool_name": "<tool>", "arguments": {{}}, "reasoning": "<brief reason>"}}
user_turn: |
  Step {high_level_step}

  {last_transition_summary}

  Visible objects:
  {object_catalog_summary}

  Held objects: {held_objects}
  Agent pose: {agent_pose}
  Current room: {current_room}
  Available target handles: {target_handles}
  Available room handles: {room_handles}
  Human messages: {human_messages}
  Visible issues: {visible_issues}
  Scheduler notices: {scheduler_notices}

  Recent tool history:
  {tool_history}

  {standard_vlm_turn_rules}

  Use the image(s) and context to choose the next tool call.
image_position: after_text
image_label_format: ""
